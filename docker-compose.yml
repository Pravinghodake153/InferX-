version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferx_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./_uploads:/app/_uploads
      - ./exports:/app/exports
      - ./audit_logs:/app/audit_logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inferx_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
